<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Menu card placeholder</title>
  <desc id="desc">A stylized placeholder for restaurant menu images.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff4d6"/>
      <stop offset="100%" stop-color="#f1c27d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7a3f1d"/>
      <stop offset="100%" stop-color="#4e2916"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect x="120" y="140" width="960" height="1320" rx="24" fill="url(#panel)" opacity="0.96"/>
  <circle cx="600" cy="410" r="200" fill="#f8d9a0" opacity="0.25"/>
  <text x="600" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#fff4d6">MARTABAAN</text>
  <text x="600" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#f8d9a0" letter-spacing="8">RESTAURANT &amp; BAKERY</text>
  <line x1="270" y1="590" x2="930" y2="590" stroke="#f8d9a0" stroke-width="3"/>
  <g font-family="Arial, sans-serif" fill="#fff4d6">
    <text x="600" y="700" text-anchor="middle" font-size="54" font-weight="700">MENU</text>
    <text x="600" y="860" text-anchor="middle" font-size="30">House Special Beverages</text>
    <text x="600" y="930" text-anchor="middle" font-size="30">Paneer &amp; Dal</text>
    <text x="600" y="1000" text-anchor="middle" font-size="30">Tikka Shikka</text>
    <text x="600" y="1070" text-anchor="middle" font-size="30">Desserts</text>
  </g>
  <rect x="350" y="1145" width="500" height="80" rx="40" fill="#f8d9a0"/>
  <text x="600" y="1195" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#4e2916">Freshly prepared</text>
</svg>

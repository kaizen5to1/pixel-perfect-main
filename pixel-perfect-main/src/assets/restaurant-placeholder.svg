  <title id="title">Restaurant placeholder</title>
  <desc id="desc">A stylized placeholder for restaurant photography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7d29d"/>
